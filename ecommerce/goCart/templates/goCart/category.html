{% extends "goCart/base.html" %}
{% load static %}
{% block title %}Category{% endblock title %}


{% block main-content %}
<h1>Category :</h1>
<div class="container text-center">


    <div class="row mt-5">
        {% for item in product %}
        <div class=" col-lg-4 col-md-6 mb-4">
            <a href="#">
                <div class="card project-card h-100 shadow">
                    <img src="{{item.product_image.url}}" class="card-img-top">
                    <div class="card-body">
                        <h5>{{ item.title }}</h5>
                        <div class="fw-bold">
                            Rs. {{item.discounted_price}}
                            <small class="fw-light text-decoration-line-through">{{ item.selling_price}}
                            </small>
                        </div>
                    </div>

                </div>
            </a>
        </div>
        {% endfor %}
    </div>

</div>
{% endblock main-content %}
